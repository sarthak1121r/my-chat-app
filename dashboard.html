<!DOCTYPE html>
<html>
<head>
    <title>Neon Hub - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050505; color: white; overflow: hidden;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        nav {
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
        }

        .user-tag { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .dot-online { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

        .dashboard-content {
            display: flex; flex-direction: column; align-items: center; padding-top: 50px;
        }

        h2 { font-size: 32px; margin-bottom: 40px; letter-spacing: -1px; }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; width: 90%; max-width: 900px;
        }

        .card {
            padding: 30px; border-radius: 24px; cursor: pointer; text-align: left;
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.08); border-color: #a855f7; }

        .card h3 { margin: 0; font-size: 22px; color: #a855f7; }
        .card p { color: rgba(255,255,255,0.5); font-size: 14px; margin: 10px 0 20px; }
        
        .btn-enter {
            padding: 10px 20px; border-radius: 10px; border: none;
            background: rgba(168, 85, 247, 0.2); color: #a855f7;
            font-weight: 600; cursor: pointer;
        }

        .logout-btn {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444; padding: 8px 16px; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <nav>
        <div class="user-tag">
            <div class="dot-online"></div>
            <span>Welcome, <span id="display-name">User</span></span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard-content">
        <h2>Your Neon Hub</h2>
        
        <div class="grid">
            <div class="card glass" onclick="window.location.href='/chat'">
                <h3>Global Chat</h3>
                <p>Connect with friends in real-time with neon glass aesthetics.</p>
                <button class="btn-enter">Enter Room →</button>
            </div>

            <div class="card glass">
                <h3>User Profile</h3>
                <p>Customize your avatar, bio, and account settings.</p>
                <button class="btn-enter" style="opacity: 0.5; cursor: not-allowed;">Coming Soon</button>
            </div>

            <div class="card glass">
                <h3>Mini Games</h3>
                <p>Play simple web games while you wait for replies.</p>
                <button class="btn-enter" style="opacity: 0.5; cursor: not-allowed;">Coming Soon</button>
            </div>
        </div>
    </div>

    <script>
        // Check if user is actually logged in
        const user = sessionStorage.getItem('username');
        if (!user) {
            window.location.href = '/'; // Kick back to login if no "wristband"
        } else {
            document.getElementById('display-name').textContent = user;
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }

        // --- BACKGROUND PARTICLES (Matching Theme) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initParticles() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5, speedX: Math.random() * 0.4 - 0.2,
                    speedY: Math.random() * 0.4 - 0.2, color: Math.random() > 0.5 ? '#a855f7' : '#ec4899'
                });
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                ctx.fillStyle = p.color; ctx.globalAlpha = 0.2;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initParticles);
        initParticles(); animate();
    </script>
</body>
</html>
