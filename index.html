<!DOCTYPE html>
<html>
<head>
    <title>Neon Glass Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505; color: white; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); }

        #chat-screen { display: flex; height: 100%; flex-direction: column; }
        #header { margin: 15px; padding: 15px 25px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-buttons { display: flex; gap: 10px; }
        .icon-btn { background: rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.5); color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .icon-btn:hover { background: #a855f7; box-shadow: 0 0 15px #a855f7; }

        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; list-style: none; display: flex; flex-direction: column; gap: 18px; margin: 0; }
        li { max-width: 80%; padding: 14px 18px; border-radius: 22px; font-size: 15px; display: flex; align-items: flex-end; gap: 12px; animation: slideIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        .my-message { align-self: flex-end; background: #7c3aed; border-bottom-right-radius: 4px; flex-direction: row-reverse; }
        .other-message { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); }

        #typing-indicator { padding: 0 25px 10px; font-size: 12px; color: #a855f7; height: 25px; display: none; align-items: center; gap: 5px; }
        .dot { width: 4px; height: 4px; background: #a855f7; border-radius: 50%; animation: wave 1.3s infinite; }
        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }
        @keyframes wave { 0%, 60%, 100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-4px); opacity: 1; } }

        #form { padding: 20px; display: flex; gap: 12px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); }
        #img-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #a855f7; padding: 0 5px; }
        #input { flex-grow: 1; background: rgba(255,255,255,0.05); border-radius: 30px; padding: 14px; color: white; border: none; outline: none;}
        .send-btn { background: linear-gradient(135deg, #a855f7, #7c3aed); border: none; width: 55px; border-radius: 50%; color: white; cursor: pointer;}
        .chat-image { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }
        .blue-tick { color: #60a5fa; margin-left: 5px; font-size: 10px; }
        .time { font-size: 10px; opacity: 0.4; margin-left: 8px; }

        /* VIDEO CALL UI */
        #call-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .video-container { position: relative; width: 80%; max-width: 800px; height: 60%; background: #000; border-radius: 20px; overflow: hidden; border: 2px solid #a855f7; box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 100px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; background: #222; }
        .call-controls { margin-top: 30px; display: flex; gap: 20px; }
        .end-call-btn { background: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div id="call-screen">
        <h2 id="call-status" style="margin-bottom: 20px;">Calling...</h2>
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="end-call-btn" id="end-call-btn">End Call</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="header" class="glass">
            <span id="user-display" style="font-weight: bold; font-size: 18px;">Chat Room</span>
            <div class="header-buttons">
                <button class="icon-btn" id="voice-call-btn" title="Voice Call">📞</button>
                <button class="icon-btn" id="video-call-btn" title="Video Call">📹</button>
                <button id="clear-btn" style="padding: 8px 18px; border-radius: 12px; font-size: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; cursor: pointer;">Clear</button>
            </div>
        </div>
        <ul id="messages"></ul>
        
        <div id="typing-indicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span id="typing-text" style="margin-left: 5px;"></span>
        </div>

        <form id="form" class="glass">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" id="img-btn">📷</button>
            <input id="input" autocomplete="off" placeholder="Type a message...">
            <button class="send-btn">➤</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const myName = sessionStorage.getItem('username');
        if (!myName) window.location.href = '/'; 

        // --- BACKGROUND PARTICLES ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initParticles() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 0.5, speedX: Math.random() * 0.5 - 0.25, speedY: Math.random() * 0.5 - 0.25, color: Math.random() > 0.5 ? '#a855f7' : '#ec4899' });
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.x += p.speedX; p.y += p.speedY; if(p.x < 0 || p.x > canvas.width) p.speedX *= -1; if(p.y < 0 || p.y > canvas.height) p.speedY *= -1; ctx.fillStyle = p.color; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initParticles);
        initParticles(); animate();

        // --- CHAT LOGIC ---
        const socket = io(); 
        let typingTimer;

        function getAvatar(name) {
            const colors = ['#a855f7', '#ec4899', '#3b82f6', '#10b981'];
            const color = colors[name.charCodeAt(0) % colors.length];
            return `<div class="avatar" style="background: ${color}">${name.charAt(0)}</div>`;
        }

        socket.on('typing', (name) => {
            const indicator = document.getElementById('typing-indicator');
            document.getElementById('typing-text').textContent = `${name} is typing`;
            indicator.style.display = 'flex';
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { indicator.style.display = 'none'; }, 2000);
        });

        socket.on('chat message', (msg) => {
            document.getElementById('typing-indicator').style.display = 'none';
            const li = document.createElement('li');
            const isMe = msg.user === myName;
            li.className = isMe ? 'my-message' : 'other-message';
            let content = msg.img ? `<img src="${msg.img}" class="chat-image">` : `<span>${msg.text}</span>`;
            li.innerHTML = `${getAvatar(msg.user)}<div><div style="font-size: 10px; opacity: 0.5; margin-bottom: 2px;">${msg.user}</div>${content}<span class="time">${msg.time}</span>${isMe ? '<span class="blue-tick">✔✔</span>' : ''}</div>`;
            document.getElementById('messages').appendChild(li);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });

        const inputField = document.getElementById('input');
        inputField.addEventListener('input', () => { socket.emit('typing', myName); });

        document.getElementById('img-btn').addEventListener('click', () => document.getElementById('image-input').click());
        document.getElementById('image-input').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => { const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); socket.emit('chat message', { user: myName, img: e.target.result, time: time }); };
                reader.readAsDataURL(file); this.value = '';
            }
        });

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(inputField.value) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                socket.emit('chat message', { user: myName, text: inputField.value, time: time });
                inputField.value = '';
            }
        });
        document.getElementById('clear-btn').addEventListener('click', () => { document.getElementById('messages').innerHTML = ''; });

        // ==========================================
        // --- WEBRTC CALLING LOGIC (THE MAGIC) ---
        // ==========================================
        let localStream;
        let peerConnection;
        
        // Google's free public STUN servers
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const callScreen = document.getElementById('call-screen');
        const callStatus = document.getElementById('call-status');

        async function startCall(isVideoCall) {
            callScreen.style.display = 'flex';
            callStatus.innerText = 'Requesting Camera/Mic...';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                localVideo.srcObject = localStream;
                
                peerConnection = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                peerConnection.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) socket.emit('ice-candidate', event.candidate);
                };

                callStatus.innerText = 'Ringing...';
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call-offer', { offer: offer, caller: myName, isVideo: isVideoCall });

            } catch (error) {
                alert("Could not access camera/microphone.");
                endCall(true); // Treat as if we hung up
            }
        }

        // --- INCOMING CALL LOGIC ---
        socket.on('call-offer', async (data) => {
            const accept = confirm(`Incoming ${data.isVideo ? 'Video' : 'Voice'} Call from ${data.caller}. Accept?`);
            if (!accept) return;

            callScreen.style.display = 'flex';
            callStatus.innerText = `In call with ${data.caller}`;

            localStream = await navigator.mediaDevices.getUserMedia({ video: data.isVideo, audio: true });
            localVideo.srcObject = localStream;
            
            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };
            peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit('ice-candidate', event.candidate); };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('call-answer', { answer: answer });
        });

        socket.on('call-answer', async (data) => {
            callStatus.innerText = 'Connected!';
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async (candidate) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        // --- END CALL LOGIC (NOW SYNCHRONIZED) ---
        function endCall(isSender = true) {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            callScreen.style.display = 'none';

            // Send signal to the other person if WE clicked hang up
            if (isSender) {
                socket.emit('end-call');
            }
        }

        // When YOU click the red button
        document.getElementById('end-call-btn').addEventListener('click', () => endCall(true));

        // When the OTHER PERSON hangs up
        socket.on('end-call', () => {
            callStatus.innerText = 'Call Ended';
            setTimeout(() => {
                endCall(false); 
            }, 1000);
        });

        document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));
        document.getElementById('voice-call-btn').addEventListener('click', () => startCall(false));

    </script>
</body>
</html>
