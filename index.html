<!DOCTYPE html>
<html>
<head>
    <title>Neon Glass Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050505; color: white; overflow: hidden;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* login-screen is now hidden initially because server.js defaults to welcome.html */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100%; }
        .login-box { width: 90%; max-width: 380px; padding: 40px; border-radius: 28px; text-align: center; }

        h1 { 
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px; margin-bottom: 30px; letter-spacing: -1px;
        }

        input {
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);
            color: white; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #a855f7; background: rgba(0,0,0,0.6); }

        button {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white; font-weight: 600; cursor: pointer; transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }

        #chat-screen { display: none; height: 100%; flex-direction: column; }

        #header {
            margin: 15px; padding: 15px 25px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        #messages { 
            flex-grow: 1; overflow-y: auto; padding: 20px; list-style: none;
            display: flex; flex-direction: column; gap: 18px;
        }

        li { 
            max-width: 80%; padding: 14px 18px; border-radius: 22px; 
            font-size: 15px; display: flex; align-items: flex-end; gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        .my-message { align-self: flex-end; background: #7c3aed; border-bottom-right-radius: 4px; flex-direction: row-reverse; }
        .other-message { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }

        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
            text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2);
        }

        #typing-indicator {
            padding: 0 25px 10px; font-size: 12px; color: #a855f7; height: 25px; display: none; align-items: center; gap: 5px;
        }
        .dot { width: 4px; height: 4px; background: #a855f7; border-radius: 50%; animation: wave 1.3s infinite; }
        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }
        @keyframes wave { 0%, 60%, 100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-4px); opacity: 1; } }

        #form { padding: 20px; display: flex; gap: 12px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); }
        #img-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #a855f7; padding: 0 5px; }
        #input { flex-grow: 1; background: rgba(255,255,255,0.05); border-radius: 30px; }
        .chat-image { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }

        @keyframes tickPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .blue-tick { color: #60a5fa; margin-left: 5px; font-size: 10px; animation: tickPop 0.3s ease-out; }
        .time { font-size: 10px; opacity: 0.4; margin-left: 8px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box glass">
            <h1>Neon Chat</h1>
            <input id="username" type="text" placeholder="Username">
            <input id="password" type="password" placeholder="Password">
            <button id="join-btn">Connect</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="header" class="glass">
            <span id="user-display">Chat Room</span>
            <button id="clear-btn" style="width: auto; padding: 8px 18px; font-size: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.5);">Clear</button>
        </div>
        <ul id="messages"></ul>
        
        <div id="typing-indicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span id="typing-text" style="margin-left: 5px;"></span>
        </div>

        <form id="form" class="glass">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" id="img-btn">📷</button>
            <input id="input" autocomplete="off" placeholder="Type a message...">
            <button style="width: 55px; border-radius: 50%;">➤</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- BACKGROUND PARTICLES ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initParticles() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5, speedX: Math.random() * 0.5 - 0.25,
                    speedY: Math.random() * 0.5 - 0.25, color: Math.random() > 0.5 ? '#a855f7' : '#ec4899'
                });
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                ctx.fillStyle = p.color; ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initParticles);
        initParticles(); animate();

        // --- CORE CHAT LOGIC ---
        let socket; // Initialize variable but don't assign yet
        let myName = "";
        let typingTimer;

        function getAvatar(name) {
            const colors = ['#a855f7', '#ec4899', '#3b82f6', '#10b981'];
            const color = colors[name.charCodeAt(0) % colors.length];
            return `<div class="avatar" style="background: ${color}">${name.charAt(0)}</div>`;
        }

        document.getElementById('join-btn').addEventListener('click', () => {
            const name = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            
            if(name && pass) {
                // STEP 2: ONLY CONNECT WHEN BUTTON IS CLICKED
                socket = io(); 
                
                socket.emit('login', { username: name, password: pass }, (res) => {
                    if(res.success) {
                        myName = name;
                        setupSocketListeners(); // Activate listeners only after login
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('chat-screen').style.display = 'flex';
                        document.getElementById('user-display').innerHTML = `<b>${name}</b>`;
                    } else { 
                        alert(res.message); 
                        socket.disconnect(); // Kill connection if login fails
                    }
                });
            }
        });

        function setupSocketListeners() {
            socket.on('typing', (name) => {
                const indicator = document.getElementById('typing-indicator');
                document.getElementById('typing-text').textContent = `${name} is typing`;
                indicator.style.display = 'flex';
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => { indicator.style.display = 'none'; }, 2000);
            });

            socket.on('chat message', (msg) => {
                document.getElementById('typing-indicator').style.display = 'none';
                const li = document.createElement('li');
                const isMe = msg.user === myName;
                li.className = isMe ? 'my-message' : 'other-message';
                let content = msg.img ? `<img src="${msg.img}" class="chat-image">` : `<span>${msg.text}</span>`;
                li.innerHTML = `
                    ${getAvatar(msg.user)}
                    <div>
                        <div style="font-size: 10px; opacity: 0.5; margin-bottom: 2px;">${msg.user}</div>
                        ${content}
                        <span class="time">${msg.time}</span>
                        ${isMe ? '<span class="blue-tick">✔✔</span>' : ''}
                    </div>
                `;
                document.getElementById('messages').appendChild(li);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            });
        }

        // Inputs
        const inputField = document.getElementById('input');
        inputField.addEventListener('input', () => { if(socket) socket.emit('typing', myName); });

        document.getElementById('img-btn').addEventListener('click', () => document.getElementById('image-input').click());
        document.getElementById('image-input').addEventListener('change', function() {
            const file = this.files[0];
            if (file && socket) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    socket.emit('chat message', { user: myName, img: e.target.result, time: time });
                };
                reader.readAsDataURL(file);
                this.value = '';
            }
        });

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(inputField.value && socket) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                socket.emit('chat message', { user: myName, text: inputField.value, time: time });
                inputField.value = '';
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => { document.getElementById('messages').innerHTML = ''; });
    </script>
</body>
</html>
